<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch is not one sense — a reading journey for hands-on practitioners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* A deliberately different look from the instrument pieces in this family.
   Warm paper, generous measure, soft rounded shapes, no gridlines anywhere.
   Fraunces for headings (genuinely soft, slightly odd warmth), Newsreader
   for reading. Light only — this one has no dark mode on purpose. */

:root{
  --paper:#FAF5EF; --paper2:#F2E9DE; --card:#FFFCF8;
  --ink:#33291F; --ink2:#6B5D4E; --ink3:#9E8F7D;
  --rule:#E7DACA; --soft:#EFE4D5;
  --clay:#C0603F;      /* the slow road — feeling */
  --blue:#4E7CA6;      /* the fast road — information */
  --sage:#6E8B68;
  --gold:#CE9A3F;
  --dis:#B0755F;
  --neg:#A8503A;      /* the negative reading — a deeper, cooler clay */
  --shadow:0 1px 2px rgba(80,60,40,.05), 0 10px 30px -18px rgba(80,60,40,.35);
  --gutter:24px;       /* .wrap side padding; figures cancel it on phones */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.68;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces","Newsreader",Georgia,serif;font-weight:600;
  letter-spacing:-.012em;margin:0;line-height:1.14}
p{margin:0 0 1.05em}
a{color:var(--clay);text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
svg{display:block;width:100%;height:auto}
/* The narrow scenes are drawn at 420u. Past ~460px of box they would scale a
   13u label above 14px and start to look like a poster, so cap and centre. */
@media (max-width:820px){figure svg{max-width:460px;margin-left:auto;margin-right:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter) 120px}

/* ── opening ─────────────────────────────────────────────────── */
.hero{padding:76px 0 30px;max-width:36rem}
.hero .eyebrow{font-family:"Fraunces",serif;font-size:14px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dis);margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,60px);margin-bottom:20px}
.hero .stand{font-size:21.5px;line-height:1.6;color:var(--ink2)}
.hero .meta{margin-top:26px;font-size:15px;color:var(--ink3);
  border-top:1px solid var(--rule);padding-top:16px}

/* ── what this is ───────────────────────────────────────────── */
.about{max-width:38rem;margin:0 0 20px;padding:22px 0 4px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ab{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:11px 0;
  border-bottom:1px solid var(--rule)}
.ab:last-child{border-bottom:none}
.ab .k{font-family:"Fraunces",serif;font-size:13.5px;letter-spacing:.04em;color:var(--dis);
  padding-top:3px}
.ab .v{font-size:17px;line-height:1.58;color:var(--ink2)}
.ab .v b{color:var(--ink);font-weight:600}
@media (max-width:640px){.ab{grid-template-columns:1fr;gap:3px}}

/* ── the research, at the top of each stop ──────────────────── */
.src{max-width:33rem;margin:0 0 22px;padding:13px 16px;border-radius:12px;
  background:var(--paper2);font-size:16px;line-height:1.55;color:var(--ink2)}
.src .lbl{display:block;font-family:"Fraunces",serif;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dis);margin-bottom:5px}
a.cite{display:inline-block;font-size:11.5px;font-family:"Fraunces",serif;
  vertical-align:super;line-height:1;text-decoration:none;color:var(--clay);
  background:var(--card);border-radius:8px;padding:2px 5px;margin:0 1px}
a.cite:hover{background:var(--clay);color:#fff}
a.wiki{color:var(--blue);text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px}
a.wiki:hover{text-decoration-style:solid}

/* ── references ─────────────────────────────────────────────── */
ol.refs{margin:10px 0 0;padding-left:26px;font-size:15.5px;line-height:1.5}
ol.refs li{padding:9px 0;border-bottom:1px solid var(--rule)}
ol.refs li:target{background:var(--paper2);border-radius:8px;padding-left:8px}
ol.refs .au{color:var(--ink);display:block}
ol.refs a{display:block;margin:2px 0}
ol.refs .jo{color:var(--ink3);font-size:14.5px;display:block}

/* ── contents ────────────────────────────────────────────────── */
.toc{position:fixed;left:max(14px,calc(50vw - 656px));top:50%;transform:translateY(-50%);
  z-index:10;display:none}
@media (min-width:1340px){.toc{display:block}}
.toc a{display:block;font-family:"Fraunces",serif;font-size:12.5px;color:var(--ink3);
  text-decoration:none;padding:5px 0 5px 14px;border-left:2px solid var(--rule);
  max-width:108px;line-height:1.3}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--clay);border-left-color:var(--clay)}

/* ── a stop on the journey ───────────────────────────────────── */
.stop{padding:54px 0;border-top:1px solid var(--rule)}
.stop .year{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dis);margin-bottom:10px}
.stop h2{font-size:clamp(28px,3.6vw,36px);margin-bottom:16px;max-width:24ch}
.stop .lead{font-size:20.5px;line-height:1.6;color:var(--ink2);margin-bottom:22px;max-width:34rem}
.stop .body{max-width:33rem}
.stop .body b{font-weight:600;color:var(--ink)}

/* part dividers */
.part{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dis);padding:44px 0 0;border-top:2px solid var(--clay);margin-top:34px;opacity:.9}
.part + .stop{border-top:none;padding-top:14px}

/* ── figures ─────────────────────────────────────────────────── */
figure{margin:26px 0 24px;background:var(--card);border:1px solid var(--rule);
  border-radius:18px;padding:18px 20px 14px;box-shadow:var(--shadow)}
figure .cap{font-size:14.5px;color:var(--ink3);line-height:1.5;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--rule)}
.wide{margin-left:calc(-1 * min(52px, 4vw));margin-right:calc(-1 * min(52px, 4vw))}
@media (max-width:820px){.wide{margin-left:0;margin-right:0}}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  margin-bottom:14px;font-size:15px;color:var(--ink2)}
.controls input[type=range]{width:190px;accent-color:var(--clay)}
.controls b{font-family:"Fraunces",serif;color:var(--ink);min-width:80px;display:inline-block}
.pill{border:1.5px solid var(--rule);background:var(--paper);border-radius:22px;
  padding:6px 15px;font-size:15px;color:var(--ink2)}
.pill:hover{border-color:var(--ink3);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}

/* ── the paper card ──────────────────────────────────────────── */
.paper{background:var(--paper2);border-radius:14px;padding:15px 18px;margin:22px 0;
  max-width:33rem;font-size:15.5px;line-height:1.5}
.paper .who{color:var(--ink2)}
.paper .what{font-family:"Fraunces",serif;font-size:17px;font-weight:600;margin:3px 0 4px}
.paper .where{color:var(--ink3);font-size:14.5px}
.paper a{font-size:15px}
.paper .grade{display:inline-block;margin-top:9px;font-size:13.5px;color:var(--ink2);
  background:var(--card);border-radius:20px;padding:3px 12px}

/* ── the takeaway for hands ──────────────────────────────────── */
.hands{max-width:33rem;margin:24px 0 0;padding:18px 20px;border-radius:16px;
  background:linear-gradient(180deg,var(--soft),var(--paper2))}
.hands .t{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dis);margin-bottom:7px}
.hands p{margin:0;font-size:18px;line-height:1.58}

/* ── flip cards ──────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:14px;margin:10px 0 4px}
.flip{background:var(--paper2);border-radius:14px;padding:16px 17px;text-align:left;
  min-height:170px;display:flex;flex-direction:column;justify-content:space-between;
  border:1.5px solid transparent}
.flip:hover{border-color:var(--rule)}
.flip .side{font-size:16.5px;line-height:1.48;color:var(--ink2)}
.flip .side span{display:block;font-family:"Fraunces",serif;font-size:12.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.flip .tap{font-size:13.5px;color:var(--ink3);margin-top:12px}
.flip[aria-pressed="true"]{background:var(--card);border-color:var(--clay)}
.flip[aria-pressed="true"] .side{color:var(--ink)}
.flip[aria-pressed="true"] .side span{color:var(--clay)}

/* ── closing ─────────────────────────────────────────────────── */
.close{padding:52px 0 0;border-top:1px solid var(--rule)}
.close h2{font-size:32px;margin-bottom:18px}
.rules{max-width:33rem;margin:0;padding:0;list-style:none}
.rules li{padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative;
  font-size:18px;line-height:1.55}
.rules li::before{content:"";position:absolute;left:2px;top:23px;width:11px;height:11px;
  border-radius:50%;background:var(--clay);opacity:.55}
.rules li b{font-weight:600}
.reading{margin-top:34px;max-width:36rem;font-size:16px;line-height:1.6;color:var(--ink2)}
.reading h3{font-size:20px;margin-bottom:12px;color:var(--ink)}
.reading div{padding:10px 0;border-bottom:1px solid var(--rule)}
.reading .n{font-family:"Fraunces",serif;color:var(--ink)}
.foot{margin-top:44px;font-size:15px;line-height:1.6;color:var(--ink3);max-width:34rem}

/* ── svg text ────────────────────────────────────────────────── */
.lab{font-family:"Fraunces",serif;font-size:15px;fill:var(--ink)}
.sm{font-family:"Newsreader",serif;font-size:14.5px;fill:var(--ink2)}
.xs{font-family:"Newsreader",serif;font-size:13px;fill:var(--ink3)}
.big{font-family:"Fraunces",serif;font-size:38px;font-weight:600;fill:var(--ink)}
@media (max-width:700px){
  body{font-size:18px}
  .stop{padding:42px 0}

  /* Figures run edge to edge. The gutter is worth more to the drawing than
     to the card, and nothing inside the SVG moves — only the box it scales
     into gets wider. Worth ~60px, which is ~20% more drawing on a 375 phone. */
  /* figure.wide, not figure: .wide zeroes these margins at <=820px and a bare
     element selector loses to it. */
  figure, figure.wide{margin-left:calc(-1 * var(--gutter));margin-right:calc(-1 * var(--gutter));
    padding:14px 8px 10px;border-radius:0;border-left:none;border-right:none}
  figure .cap{margin-left:8px;margin-right:8px}

  /* thumb-sized controls: 15px pills are a 26px tap target, under the 44px floor */
  .controls{gap:11px}
  .controls input[type=range]{width:100%;height:36px}
  .controls b{min-width:0}
  .pill{padding:11px 18px;font-size:16px}
  .flip{min-height:0}
}
</style>
</head>
<body>
<div class="wrap"></div>
<script>
/* journey.js — everything the page says.
 *
 * Two small markup conventions used inside the prose strings:
 *   [ref:id]           → a superscript link down to the reference list
 *   {{Wiki Page|text}} → a link to English Wikipedia
 * Both are expanded by md() in page.js.
 *
 * Voice: talking to a skilled practitioner who is not a scientist. Warm,
 * plain, specific. Every stop names its source in the first breath. */

const HERO = {
 eyebrow:"A reading journey for hands-on practitioners",
 title:"Touch is not one sense",
 stand:`Skin carries at least two separate systems, and they are not sending the same
   message. One tells you <em>what</em> you are touching. The other answers mainly to being
   touched <em>affectionately</em> — found by accident, confirmed by a man who had lost the
   ordinary sense of touch, and it fires hardest at one particular speed.
   What follows is what we found reading our way through it: what each system responds to,
   what touch does to pain and to relationships, and which of the popular claims we could
   not get to stand up.`
};

const ABOUT = [
 {k:"What this is",
  v:`A plain-language walk through the research on touch — the
    {{Somatosensory system|sense}}, not the technique. Twelve short stops, about thirty
    minutes, with figures you can operate rather than only look at.`},
 {k:"Who it is for",
  v:`Anyone whose work involves putting hands on other people: massage therapists,
    bodyworkers, physiotherapists, osteopaths, nurses, midwives, somatic and trauma
    practitioners. <b>No science background is assumed</b> — we did not begin with much
    of one either.`},
 {k:"How it is sourced",
  v:`Every claim here points to a named paper, cited at the top of its section and listed
    in full at the bottom — so you can go and check where we have read it wrong. Where
    researchers disagree, and here they disagree a good deal, we have tried to say so rather
    than pick a side. It is not medical advice and not a technique manual.`}
];

const STOPS = [

{id:"two", nav:"Two roads", part:"Part one · the territory", year:"The idea",
 title:"There are two ways of being touched",
 lead:`Everything else here follows from one thing: touch is not a single sense. Two
   separate kinds of nerve fibre leave the skin at the same instant, travelling at very
   different speeds, and they are not carrying the same message.`,
 src:{line:`This first stop is the shared framework rather than a single study — it is
   drawn from the review by McGlone, Wessberg & Olausson (2014) [ref:mcglone14], which is
   also the best single thing to read after this page.`},
 scene:"roads",
 body:`<p>The <b>fast road</b> is the one most people mean by touch. Thick fibres wrapped in
   {{Myelin|myelin}}, an insulating sheath that lets a signal race along at tens of metres
   per second. They are superb at <b>what and where</b> — the exact spot, the texture, the
   pressure, the edge of the object in your hand. This is the system that lets you find a
   coin in your pocket without looking.</p>
  <p>The <b>slow road</b> is the surprise. Thin fibres with no insulation, a signal ambling
   along at about one metre per second — so slow that when someone strokes your forearm,
   that part of the message arrives something like <b>a second behind</b> the rest. They are
   poor at what and where. What they seem to carry, instead, is <b>how it feels</b>.</p>
  <p>Those two colours — blue for the fast road, clay for the slow one — mean the same
   thing in every figure from here on. Nothing below assumes you have met any of this
   before.</p>`,
 hands:`If you have ever wondered why a client goes quiet a beat <em>after</em> your hands
   land rather than as they land, there is a real signal running about a second behind the
   obvious one.`},

{id:"organ", nav:"The organ", year:"Where it happens",
 title:"You are working on a sense organ, not a covering",
 lead:`Skin is usually described as a barrier. It is also the largest sensory surface you
   have, and the fast road alone arrives on four different kinds of receptor, each answering
   to something different.`,
 src:{line:`Standard anatomy rather than a finding [ref:standring] — the classification of
   {{Mechanoreceptor|mechanoreceptors}} below is textbook material, and each type links to
   its Wikipedia entry if you want the detail.`},
 scene:"skin",
 body:`<p>Tap any receptor in the diagram. Two live near the surface and handle fine, quick
   things: {{Merkel nerve ending|Merkel cells}} for <b>edges and texture</b>, and
   {{Tactile corpuscle|Meissner corpuscles}} for <b>slip</b> — the receptor that tells you a
   glass is sliding out of your grip before you consciously notice.</p>
  <p>Two sit deeper and handle slower, coarser things. {{Bulbous corpuscle|Ruffini endings}}
   register <b>stretch</b> across the skin, part of how you know where your hand is without
   looking. {{Lamellar corpuscle|Pacinian corpuscles}} register <b>fast vibration</b>, which
   is how you feel the texture of a surface through the end of a tool rather than through
   your fingertips.</p>
  <p>And then the fifth kind: {{Free nerve ending|bare nerve endings}} with no capsule at
   all, wandering in the hairy skin. Those are the slow road, and the next four stops are
   about them.</p>`,
 hands:`When you change from a fingertip to a flat palm, from gliding to holding, from still
   to vibrating, you are not adjusting an intensity. You are moving between different
   receptors with different jobs.`},

{id:"acuity", nav:"How fine", year:"How fine",
 title:"Your fingertips are twenty times sharper than your back",
 lead:`How close together can two points be before skin stops feeling them as two? The
   answer varies across the body by more than twenty-fold — and the conclusion people
   usually draw from that is wider than the measurement allows.`,
 src:{line:`The numbers everyone quotes come from Weinstein's 1968 survey [ref:weinstein68].
   The test itself has been questioned for years as a measure of how finely you can feel [ref:tong13] — the
   ranking across the body is solid, the exact millimetres softer than they look.`},
 scene:"acuity",
 body:`<p>Pick a body part and look at the gap drawn to scale. On a <b>fingertip</b> the two
   dots have to come within two or three millimetres before they merge into one. On the
   <b>back</b> they can be nearly four centimetres apart and still feel like a single touch.
   This is {{Two-point discrimination|two-point discrimination}}, and it tracks how densely
   the fast receptors are packed.</p>
  <p>It is tempting to conclude from this that precision on a back is pointless. That would
   be over-reading a very narrow measurement, in at least three ways. <b>Locating</b> a
   single contact is generally more accurate than telling two apart, so a person can often
   say roughly where your hand is even where they could not resolve two touches. <b>Pressure
   reaches past the skin</b> — muscle, fascia and joints have their own sensory supply, and
   where you press changes what you are pressing on whatever the skin can resolve. And the
   precision may matter most <b>to you</b>: feeling your way is information travelling to you, the
   practitioner, and your fingertips resolve at two or three millimetres.</p>
  <p>What the number does tell you is narrower and still worth having: do not expect fine
   surface detail on a back to be <em>perceived</em> as detail by the person receiving it.
   And treat the exact figures gently — people can sometimes report "two" when both points
   are in the same place, which suggests the task picks up cues besides spacing.</p>`,
 hands:`Try it on yourself with two pencil tips or a bent paperclip. Fingertip, forearm,
   back. Then have someone touch one spot on your back and point to where you think it was —
   you will usually be closer than the two-point figure would suggest.`},

{id:"found", nav:"Found", part:"Part two · the second system", year:"1999",
 title:"Someone put a needle in a nerve and listened",
 lead:`The second road was found by a group in Gothenburg who were not looking for it. The
   technique is {{Microneurography|microneurography}}, and it is exactly as unlikely as it
   sounds: a very fine electrode placed into a nerve in a fully awake person, listening to
   single fibres while their skin is touched.`,
 src:{line:`Vallbo, Olausson & Wessberg (1999) [ref:vallbo99]. Not disputed — this is the
   discovery, and it has held for twenty-five years.`},
 scene:"micro",
 body:`<p>Recording from forearm skin, they kept finding fibres that made no sense. They were
   {{Group C nerve fiber|unmyelinated}} — the thin, slow kind everyone associated with pain
   and temperature — but they responded happily to a soft brush, and hardly at all to
   anything sharp.</p>
  <p>Of 38 units they picked for answering to gentle pressure on the skin, <b>27 were this
   low-threshold kind</b>. That ratio is not a count of how common they are — the units were chosen for
   responding to light touch in the first place. What tells you these fibres are not rare is
   a separate observation: the team reported running into them about as often as the classic
   fast ones.</p>
  <p>The title of the paper is the whole finding: unmyelinated fibres make up a
   <b>second system</b> for coding touch in human hairy skin. What it was <em>doing</em>
   there was completely open.</p>`,
 hands:`These fibres are called <b>CT afferents</b> — C for the slow, unmyelinated kind — the ones with no
   insulating sheath — and T for touch. That is the term you will meet everywhere else, and this is where it comes
   from.`},

{id:"patient", nav:"The proof", year:"2002",
 title:"The man who could not feel touch, and felt it anyway",
 lead:`A second system is a nice idea, but how would you ever separate it from the first?
   The answer arrived in the form of a patient who had lost the fast road entirely.`,
 src:{line:`Olausson and colleagues (2002) [ref:olausson02]. Strong evidence, and a single
   case — you cannot arrange for a second patient.`},
 scene:"patient",
 body:`<p>A rare nerve disease had destroyed his large, insulated fibres. On any standard test
   he had no sense of touch on his body: he could not feel a poke, could not say where he
   had been touched, could not feel vibration. The fast road was gone.</p>
  <p>Then they stroked his forearm softly with a brush. He <b>felt something</b> — faint,
   hard to locate, and pleasant. And when they scanned his brain, the signal was not arriving
   at the usual place. It was lighting up the {{Insular cortex|insula}}, a region that deals
   with how the body feels from the inside: hunger, warmth, breath, discomfort.</p>
  <p>This is the study that turned an anatomical curiosity into a claim about experience.
   The slow road does not just exist. It goes somewhere <b>different</b>, and somewhere with
   more in common with emotion than with the map of your skin.</p>`,
 hands:`Affectionate touch is not a gentler version of informative touch. On this evidence
   it takes a different road and arrives somewhere else in the brain.`},

{id:"speed", nav:"A speed", year:"2009",
 title:"And it has a favourite speed",
 lead:`If these fibres were built for being stroked, you would expect them to care about how
   fast. They do — and it is not the fastest, and it is not the slowest.`,
 src:{line:`Löken and colleagues (2009) [ref:loken09]. Widely replicated as a group average;
   individuals vary more than the tidy curve suggests, which part four returns to.`},
 scene:"speed",
 body:`<p>They brushed people's forearms at five speeds while listening to single fibres,
   then asked how pleasant each stroke felt. The fast fibres did the sensible thing: the
   quicker the brush, the harder they fired. Speed in, speed out.</p>
  <p>The slow fibres did something more interesting. They fired hardest at <b>middling
   speeds</b>, around one to ten centimetres a second, and less at both extremes. Drag the
   dial and watch the shape. It is a hill, not a ramp.</p>
  <p>And how pleasant people rated it made the same hill. The speeds that lit up these fibres
   were the speeds people liked, and this range is often described as the speed of a caress.
   Worth a caveat that is easy to lose: when spontaneous stroking has actually been measured,
   it tends to run somewhat <b>faster</b> than the tuning peak, even though people stroke
   more slowly the closer they feel to the person. The hill is real. "This is exactly how
   humans naturally caress" is a tidier story than the measurements support.</p>`,
 hands:`The dot moves at the real speed. Watch it rather than the curve, then try matching it
   with your own hand on your forearm. That is what the research is describing.`},

{id:"warm", nav:"And a warmth", year:"2014",
 title:"It also wants you to be warm",
 lead:`A second tuning, and the one most likely to change what you actually do. These fibres
   are fussy about temperature, and the temperature they want is skin.`,
 src:{line:`Ackerley and colleagues (2014) [ref:ackerley14]. Well supported, and a small
   study — as all microneurography is.`},
 scene:"warmth",
 body:`<p>They repeated the stroking experiment at different temperatures. The fibres
   responded best to a brush at about <b>32 degrees</b> — neutral skin temperature. Not warm.
   Not cool. The temperature of another person.</p>
  <p>And the ratings followed. People found <b>every speed</b> more pleasant at skin
   temperature than at 18 degrees or at 42 degrees. Get the warmth wrong and the speed cannot
   rescue it.</p>
  <p>Try the two together in the panel. The sweet spot is a small region, not a line, and
   both dimensions have to be right to land in it.</p>`,
 hands:`Cold hands are not merely unpleasant, they are the wrong stimulus. So is oil straight
   from a cool bottle, and so is a treatment room a couple of degrees under. This is the
   cheapest change on this page.`},

{id:"pain", nav:"Pain", part:"Part three · what touch does", year:"1965 onward",
 title:"Touch turns pain down, and company turns it down further",
 lead:`The oldest practical claim about touch, and one of the better supported. Rubbing a
   banged elbow is not superstition; there is a mechanism, and it was proposed sixty years
   ago.`,
 src:{line:`Melzack & Wall's {{Gate control theory of pain|gate control theory}} (1965)
   [ref:melzack65], then Coan, Schaefer & Davidson (2006) [ref:coan06] and Goldstein and
   colleagues (2018) [ref:goldstein18]. The framework is one of the field’s starting points, and much revised since; the
   handholding studies are small and replicated in direction.`},
 scene:"gate",
 body:`<p>The idea was that pain signals have to pass through a <b>gate</b> in the spinal
   cord on their way up, and that fast touch fibres arriving from the same patch of skin can
   partly close it. Signals coming <em>down</em> from the brain — attention, expectation,
   mood — can open or close it too.</p>
  <p>The details have been revised many times in sixty years. The central claim has held:
   <b>touch and pain are not independent channels</b>, and one turns the other up or down before
   either reaches awareness.</p>
  <p>Then there is who is doing the touching. When women anticipating an electric shock held
   someone's hand, the threat response in the brain was reduced — <b>less by a stranger's
   hand than by their husband's</b>, and the better they rated the marriage, the larger the
   effect. Later work found that handholding during pain came with increased coupling between
   the two people's brain activity, and that the more empathic the partner, the more the pain
   went down.</p>`,
 hands:`Contact can genuinely reduce pain, and it is not only about the contact — the same
   hand does more when it belongs to someone the person trusts. That is an argument for the
   relationship being part of the treatment rather than around it.`},

{id:"where", nav:"Where", year:"2015",
 title:"Everyone carries a map of who may touch them where",
 lead:`Not a metaphor either. Ask people to shade in which parts of their body a given person
   is allowed to touch, and something very orderly comes out.`,
 src:{line:`Suvilehto and colleagues (2015) [ref:suvilehto15]. Large and cross-cultural, and
   entirely self-report — maps of what people say they would allow, which is not the same as
   what happens.`},
 scene:"topography",
 body:`<p><b>1,368 people across five countries</b> did exactly that, for everyone from a
   partner to a stranger. The maps were remarkably consistent, and the headline finding is
   almost embarrassingly simple: <b>the total area a person is allowed to touch
   tracks the strength of the emotional bond</b>. Cultural differences were
   minor.</p>
  <p>Hands are permitted to nearly everyone. The area expands outward from there as the
   relationship closes, and for a stranger most of the body is off limits. The regions people
   guard most closely are also the regions they rate as most pleasurable to be touched on.</p>
  <p>You occupy an unusual position on that map. As a practitioner you are given access it
   reserves for the people we are closest to — by agreement, in a role, for a purpose. That is a real thing to
   hold carefully, and it is why consent in this work is not a formality.</p>`,
 hands:`Your hands are on territory that, for this person, is normally reserved. Saying what
   you are about to do before you do it is not politeness. It is how the map gets redrawn
   safely.`},

{id:"claims", nav:"How sure", year:"The evidence",
 title:"How sure can we be about any of this?",
 lead:`Touch research makes a lot of claims and they are not equally supported. Here they are
   sorted honestly, because the strong ones get less airtime than the shaky ones.`,
 src:{line:`This one figure is a judgement rather than any single paper's result — a reading
   of the literature cited throughout, leaning on Kidd, Devine & Walker's review
   [ref:kidd23] for the stress claims and Moyer and colleagues' meta-analysis [ref:moyer11]
   for the {{Cortisol|cortisol}} one.`},
 scene:"claims",
 body:`<p>Notice the shape of it. The best-supported claims are the <b>simplest and most
   physical</b>: contact reduces pain, {{Kangaroo care|skin-to-skin contact}} steadies
   newborns. The weakest are the ones about <b>hormones</b> — the {{Oxytocin|oxytocin}} and
   cortisol stories that circulate most confidently in training rooms are the ones the
   evidence supports least well.</p>
  <p>That is not an accident. Subjective outcomes are easy to measure and to move; blood
   hormones are hard to measure, vary enormously between people and across a day, and rarely
   shift as neatly as the story requires. When you hear a claim about touch and a named
   hormone, treat it as the least secure thing in the sentence.</p>`,
 hands:`You do not need the hormone claims. The evidence you actually have — pain, comfort,
   distress, sleep in newborns — is stronger, more directly about what people come to you
   for, and much harder to argue with.`},

{id:"wrong", nav:"Corrections", part:"Part four · being honest about it", year:"2012–2023",
 title:"Four things this field has had to take back",
 lead:`Everything in part two is a decade old or more, and parts of it have been revised. A
   practitioner quoting the 2014 version is now quoting something the researchers have moved
   on from.`,
 src:{line:`Six papers between 2021 and 2023, named on the cards: Watkins [ref:watkins21],
   Case [ref:case21], Ali [ref:ali23], Bendas [ref:bendas21], Crucianelli [ref:crucianelli22]
   and — the largest — Schirmer, Croy & Ackerley [ref:schirmer23], a review by researchers
   inside the field checking their own published work.`},
 scene:"revisions",
 body:`<p>None of these demolish the story. They complicate it in ways that mostly make it
   <b>more</b> useful, and they are worth knowing so that you are not the last person in the
   room still saying the old version.</p>
  <p>The fourth is the largest and the least comfortable. Going through the literature, the
   authors found that of the papers using the phrase "{{Affective touch|affective touch}}",
   only <b>34%</b> even mention these fibres. A nerve fibre and a human experience had quietly
   become the same word, and they are not the same thing.</p>`,
 hands:`When you explain your work, describe the <b>touch</b> — slow, light, warm, moving, on
   a forearm — rather than claiming to activate a named nerve fibre. The first is accurate and
   checkable; the second goes further than anyone can currently support.`},

{id:"meaning", nav:"Meaning", year:"Now",
 title:"The fibre is not the feeling",
 lead:`The most useful correction of all, and it comes from within the research rather than
   from its critics.`,
 src:{line:`Sailer & Leknes (2022) [ref:sailer22] and Schirmer, Croy & Schweinberger (2022)
   [ref:schirmer22]. Position pieces rather than experiments — arguments about how to read
   the evidence, from people who generated much of it.`},
 scene:"context",
 body:`<p>The same stroke, at the same speed and the same temperature, is not the same
   experience depending on who is doing it, whether you consented, what happened last time,
   and what you believe it is for. One paper's title puts it plainly: <b>meaning makes touch
   affective</b>. The other argues that social touch is better understood as a <b>tool</b>
   people use to do something to each other than as a signal being transmitted.</p>
  <p>That is not a demotion of the nerve fibres. It is a description of where they sit. They
   look like a <b>doorway</b> — a channel well suited to carrying this kind of contact. What
   comes through the doorway is decided by everything else.</p>
  <p>Which is, if you think about it, what a good practitioner already knows. The biology
   has caught up with the room.</p>`,
 hands:`Speed and warmth are worth getting right, and they are the smaller half. Consent,
   predictability, and whether the person wanted to be touched by <em>you</em> are doing more
   work than any number on this page.`}
];

/* scenes.js — the illustrations.
 *
 * Deliberately not charts. Rounded caps, soft fills, no gridlines, no axes
 * unless one is genuinely needed. Everything is drawn at 860 wide and
 * scales down.
 *
 * A small deterministic wobble is applied to the long "slow road" paths so
 * they read as drawn rather than plotted — the fast road stays straight,
 * which is also the point. */

/* Drawing width in user units. The SVG scales to fit its box, so what the
   reader sees is (box px / W). At 860 that is fine on a desktop and about
   0.36 on a phone, which puts a 13u label at 4.7px — unreadable. Below the
   .wide breakpoint the scenes are drawn at NARROW_W instead and laid out in
   one column, so the same label lands at 9-14px. See layout(). */
const WIDE_W = 860, NARROW_W = 420;
const narrowQ = typeof matchMedia === "function" ? matchMedia("(max-width:820px)") : null;
let NARROW = !!(narrowQ && narrowQ.matches);
let W = NARROW ? NARROW_W : WIDE_W;
function layout(){
  NARROW = !!(narrowQ && narrowQ.matches);
  W = NARROW ? NARROW_W : WIDE_W;
  return NARROW;
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const clamp = (v,a,b) => v<a?a:v>b?b:v;

/* forearm shape used in several scenes */
function arm(x,y,w,h){
  return `<path d="M${x} ${y+h/2}
    q${w*0.06} ${-h/2} ${w*0.30} ${-h*0.44}
    q${w*0.34} ${-h*0.10} ${w*0.58} ${h*0.02}
    q${w*0.12} ${h*0.06} ${w*0.12} ${h*0.42}
    q0 ${h*0.36} ${-w*0.12} ${h*0.42}
    q${-w*0.24} ${h*0.12} ${-w*0.58} ${h*0.02}
    q${-w*0.24} ${h*0.06} ${-w*0.30} ${-h*0.44} Z"
    fill="var(--soft)" stroke="var(--rule)" stroke-width="2"/>`;
}

/* ══ 1. two roads ══════════════════════════════════════════════ */

   height, so the gap between them still reads as distance travelled. */

  s+=box(14,"what and where","texture, edges, exact spot","--blue");

  s+=`<path id="fastPath" d="M${tx+10} ${sy+4}L${W-104} 92" stroke="var(--blue)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${W-104} 92l-1 -17m1 17l-16 -6" stroke="var(--blue)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;

  s+=`<text class="xs" id="slowLand" x="${W-28}" y="126" text-anchor="end" opacity="0" style="fill:var(--clay)">arrived</text>`;
  return s+"</svg>";
}

function sceneRoads(){
  if(NARROW) return roadsNarrow();
  const H=330, sx=90, sy=252;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Two nerve routes leaving the skin: a fast straight one and a slow wandering one">`;
  /* skin */
  s+=`<rect x="60" y="${sy}" width="${W-120}" height="26" rx="13" fill="var(--soft)"/>`;
  s+=`<text class="xs" x="72" y="${sy+43}">skin</text>`;
  /* the touch */
  s+=`<circle cx="${sx+58}" cy="${sy+13}" r="13" fill="var(--clay)" opacity=".25"/>`;
  s+=`<circle cx="${sx+58}" cy="${sy+13}" r="6" fill="var(--clay)"/>`;
  s+=`<text class="sm" x="${sx+58}" y="${sy+62}" text-anchor="middle">a hand lands here</text>`;
  /* fast road — dead straight */
  s+=`<path id="fastPath" d="M${sx+70} ${sy+6}L${W-300} 74" stroke="var(--blue)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${W-300} 74l-16 -2m16 2l-6 15" stroke="var(--blue)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;
  /* slow road — wanders */
  s+=`<path id="slowPath" d="M${sx+66} ${sy+20}
    C${sx+220} ${sy+30} ${sx+180} 200 ${sx+330} 196
    S${W-430} 168 ${W-300} 174" stroke="var(--clay)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${W-300} 174l-15 -5m15 5l-8 13" stroke="var(--clay)" stroke-width="4"
    fill="none" stroke-linecap="round"/>`;
  /* destinations */
  const box=(x,y,t1,t2,c)=>`<rect x="${x}" y="${y}" width="248" height="66" rx="18"
      fill="var(--card)" stroke="var(${c})" stroke-width="2"/>
    <text class="lab" x="${x+20}" y="${y+28}" style="fill:var(${c})">${esc(t1)}</text>
    <text class="sm" x="${x+20}" y="${y+50}">${esc(t2)}</text>`;
  s+=box(W-288, 42, "what and where", "texture, edges, exact spot", "--blue");
  s+=box(W-288, 142, "how it feels", "pleasant, close, being cared for", "--clay");
  /* speed annotations */
  s+=`<text class="sm" x="${sx+250}" y="150" style="fill:var(--blue)">fast · arrives at once</text>`;
  s+=`<text class="sm" x="${sx+250}" y="${sy-24}" style="fill:var(--clay)">slow · arrives about a second behind</text>`;
  /* the two travellers, parked at the skin until a touch is sent */
  s+=`<circle id="fastDot" cx="${sx+70}" cy="${sy+6}" r="8" fill="var(--blue)" opacity="0"/>`;
  s+=`<circle id="slowDot" cx="${sx+66}" cy="${sy+20}" r="8" fill="var(--clay)" opacity="0"/>`;
  s+=`<text class="xs" id="fastLand" x="${W-288}" y="34" opacity="0" style="fill:var(--blue)">arrived</text>`;
  s+=`<text class="xs" id="slowLand" x="${W-288}" y="134" opacity="0" style="fill:var(--clay)">arrived</text>`;
  return s+"</svg>";
}

/* ══ 2. microneurography ═══════════════════════════════════════ */
function sceneMicro(st){
  const sharp = st && st.stim === "sharp";
  /* Narrow: the arm sits above the recording panel instead of beside it. */
  const H  = NARROW ? 486 : 272;
  const bx = NARROW ? 20 : 540;
  const by = NARROW ? 254 : 88;
  const bw = NARROW ? W-16 : W-bx-52;
  const bh = NARROW ? 172 : 150;
  const sx = NARROW ? 150 : 250;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Listening to single nerve fibres while the skin is ${sharp?"prodded":"brushed"}">`;
  s+= NARROW ? arm(16, 62, 300, 100) : arm(70, 60, 420, 120);
  if(sharp){
    s+=`<path d="M${sx} ${NARROW?32:40}l0 26" stroke="var(--ink3)" stroke-width="5" stroke-linecap="round"/>`;
    s+=`<path d="M${sx-6} ${NARROW?58:66}l6 12l6 -12Z" fill="var(--ink2)"/>`;
    s+=`<text class="xs" x="${sx}" y="${NARROW?22:30}" text-anchor="middle">a sharp point</text>`;
  }else{
    s+=`<path d="M${sx} ${NARROW?36:44}l0 30" stroke="var(--ink3)" stroke-width="5" stroke-linecap="round"/>`;
    s+=`<path d="M${sx-12} ${NARROW?66:74}q12 16 24 0" fill="var(--clay)" opacity=".5"/>`;
    s+=`<text class="xs" x="${sx}" y="${NARROW?26:34}" text-anchor="middle">a soft brush</text>`;
  }
  if(NARROW){
    s+=`<path d="M340 186L296 128" stroke="var(--ink3)" stroke-width="3" stroke-linecap="round"/>`;
    s+=`<circle cx="296" cy="128" r="5" fill="var(--ink3)"/>`;
    s+=`<text class="xs" x="14" y="206">a very fine electrode, in an awake person</text>`;
  }else{
    s+=`<path d="M470 196L400 132" stroke="var(--ink3)" stroke-width="3" stroke-linecap="round"/>`;
    s+=`<circle cx="400" cy="132" r="5" fill="var(--ink3)"/>`;
    /* anchored left of the recording panel: at x=478 it ran under the
       "the slow one" label inside the panel at the same y. */
    s+=`<text class="xs" x="460" y="214" text-anchor="end">a very fine electrode, in an awake person</text>`;
  }
  s+=`<rect x="${bx-12}" y="${by-40}" width="${bw}" height="${bh}" rx="16" fill="var(--paper2)"/>`;
  s+=`<text class="xs" x="${bx+4}" y="${by-18}">what the electrode hears</text>`;
  const right = NARROW ? W-30 : W-76;
  const spikes=(y,seed,n,col)=>{
    if(n===0) return `<line x1="${bx}" y1="${y}" x2="${right}" y2="${y}" stroke="var(${col})"
      stroke-width="2" stroke-linecap="round" opacity=".45"/>`;
    let d=`M${bx} ${y}`;
    for(let i=0;i<n;i++){
      const x=bx+8+(i*(right-bx-24)/n)+((seed*(i+3))%7);
      d+=`L${x} ${y}L${x+2} ${y-22}L${x+4} ${y}`;
    }
    return `<path d="${d}L${right} ${y}" fill="none" stroke="var(${col})" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  s+=spikes(by+26, 3, sharp?20:26, "--blue");
  s+=`<text class="xs" x="${bx+4}" y="${by+44}" style="fill:var(--blue)">a fast fibre — answers to both</text>`;
  s+=spikes(by+96, 5, sharp?1:9, "--clay");
  s+=`<text class="xs" x="${bx+4}" y="${by+114}" style="fill:var(--clay)">${sharp
    ? "the slow one — almost nothing"
    : "the slow one — new, and not rare"}</text>`;
  if(NARROW){
    s+=`<text class="big" x="14" y="428">${sharp?"quiet":"27 of 38"}</text>`;
    s+=`<text class="sm" x="14" y="454">${sharp
      ? "these fibres barely answer a sharp stimulus —"
      : "units selected for answering gentle touch"}</text>`;
    s+=`<text class="sm" x="14" y="474">${sharp
      ? "which is how they were told apart"
      : "were of this slow kind"}</text>`;
  }else{
    s+=`<text class="big" x="118" y="240">${sharp?"quiet":"27 of 38"}</text>`;
    s+=`<text class="sm" x="${sharp?238:290}" y="234">${sharp
      ? "these fibres barely answer a sharp"
      : "units selected for answering gentle"}</text>`;
    s+=`<text class="sm" x="${sharp?238:290}" y="254">${sharp
      ? "stimulus — which is how they were told apart"
      : "touch were of this slow kind"}</text>`;
  }
  return s+"</svg>";
}

    if(!fastOn){

      g+=`<text class="sm" x="${x+96}" y="${y+212}" style="fill:var(--clay)">this one still works</text>`;

/* ══ 4. the speed dial ═════════════════════════════════════════ */
const SPEEDS=[0.3,1,3,10,30];
const CT   =[0.20,0.66,0.92,0.72,0.24];   // slow fibres — a hill
const AB   =[0.12,0.26,0.44,0.70,0.96];   // fast fibres — a ramp
/* Where the stroking dot travels. page.js animates it, so the geometry has to
   be readable from outside — it differs between the two layouts. */
let STROKE_GEOM={x:132, span:598};

function sceneSpeed(st){
  /* Narrow: the plot takes the full width, its two label blocks move below it
     as a pair of columns, and the forearm goes underneath those. */
  const H  = NARROW ? 452 : 340;
  const L  = NARROW ? 44 : 92;
  const R  = NARROW ? 14 : 210;
  const T  = NARROW ? 44 : 34;
  const PH = NARROW ? 130 : 140;
  const lv=v=>Math.log(v)/Math.LN10;
  const x=v=>L+(lv(v)-lv(0.25))/(lv(40)-lv(0.25))*(W-L-R);
  const y=v=>T+PH-v*PH;
  const at=arr=>{
    const v=st.vel;
    if(v<=SPEEDS[0])return arr[0]; if(v>=SPEEDS[4])return arr[4];
    let i=0; while(SPEEDS[i+1]<v) i++;
    const t=(lv(v)-lv(SPEEDS[i]))/(lv(SPEEDS[i+1])-lv(SPEEDS[i]));
    return arr[i]+(arr[i+1]-arr[i])*t;
  };
  const smooth=arr=>{
    let d="";
    for(let i=0;i<=70;i++){
      const v=Math.pow(10, lv(0.3)+(lv(30)-lv(0.3))*i/70);
      let j=0; while(j<3 && SPEEDS[j+1]<v) j++;
      const t=(lv(v)-lv(SPEEDS[j]))/(lv(SPEEDS[j+1])-lv(SPEEDS[j]));
      d+=(i?"L":"M")+x(v).toFixed(1)+" "+y(arr[j]+(arr[j+1]-arr[j])*t).toFixed(1);
    }
    return d;
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Slow fibres respond most at middling speeds; fast fibres just track speed">`;
  s+=`<rect x="${x(1)}" y="${T-6}" width="${x(10)-x(1)}" height="${PH+12}" rx="14"
    fill="var(--clay)" opacity=".08"/>`;
  s+=`<text class="xs" x="${(x(1)+x(10))/2}" y="${T-14}" text-anchor="middle" style="fill:var(--dis)">the hill · 1–10 cm a second</text>`;
  s+=`<path d="${smooth(AB)}" fill="none" stroke="var(--blue)" stroke-width="3.5"
    stroke-linecap="round"/>`;
  s+=`<path d="${smooth(CT)}" fill="none" stroke="var(--clay)" stroke-width="4"
    stroke-linecap="round"/>`;
  SPEEDS.forEach(v=>{
    s+=`<circle cx="${x(v)}" cy="${y(CT[SPEEDS.indexOf(v)])}" r="4" fill="var(--clay)"/>`;
    s+=`<text class="xs" x="${x(v)}" y="${T+PH+22}" text-anchor="middle">${v}</text>`;
  });
  s+=`<text class="xs" x="${L-14}" y="${T+8}" text-anchor="end">more</text>`;
  s+=`<text class="xs" x="${L-14}" y="${T+PH+4}" text-anchor="end">less</text>`;
  s+=`<text class="xs" x="${(L+W-R)/2}" y="${T+PH+44}" text-anchor="middle">centimetres a second</text>`;
  s+=`<line x1="${x(st.vel)}" y1="${T-6}" x2="${x(st.vel)}" y2="${T+PH+6}"
    stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
  s+=`<circle cx="${x(st.vel)}" cy="${y(at(CT))}" r="7" fill="var(--clay)"
    stroke="var(--card)" stroke-width="2.5"/>`;
  /* the two label blocks */
  if(NARROW){
    const LY=T+PH+82;
    s+=`<text class="sm" x="14" y="${LY}" style="fill:var(--blue)">fast fibres</text>`;
    s+=`<text class="xs" x="14" y="${LY+19}">faster brush,</text>`;
    s+=`<text class="xs" x="14" y="${LY+35}">more firing</text>`;
    s+=`<text class="sm" x="216" y="${LY}" style="fill:var(--clay)">slow fibres</text>`;
    s+=`<text class="xs" x="216" y="${LY+19}">and the pleasantness</text>`;
    s+=`<text class="xs" x="216" y="${LY+35}">ratings agreed</text>`;
  }else{
    let ya=y(AB[4])+5, yc=y(CT[2])+5;
    if(Math.abs(ya-yc)<62){ if(ya<yc){ yc=ya+62; } else { ya=yc+62; } }
    s+=`<text class="sm" x="${W-R+12}" y="${ya.toFixed(1)}" style="fill:var(--blue)">fast fibres</text>`;
    s+=`<text class="xs" x="${W-R+12}" y="${(ya+19).toFixed(1)}">faster brush,</text>`;
    s+=`<text class="xs" x="${W-R+12}" y="${(ya+35).toFixed(1)}">more firing</text>`;
    s+=`<text class="sm" x="${W-R+12}" y="${yc.toFixed(1)}" style="fill:var(--clay)">slow fibres</text>`;
    s+=`<text class="xs" x="${W-R+12}" y="${(yc+19).toFixed(1)}">and the pleasantness</text>`;
    s+=`<text class="xs" x="${W-R+12}" y="${(yc+35).toFixed(1)}">ratings agreed</text>`;
  }
  /* the real-speed stroke */
  const AY = NARROW ? T+PH+184 : T+PH+72;
  const AX = NARROW ? 14 : L;
  const AW = NARROW ? W-28 : W-L-R+120;
  s+=arm(AX, AY, AW, NARROW?58:66);
  STROKE_GEOM={x:AX+40, span:AW-80};
  s+=`<circle id="stroker" cx="${AX+40}" cy="${AY+(NARROW?29:33)}" r="11" fill="var(--clay)" opacity=".85"/>`;
  if(NARROW){
    s+=`<text class="xs" x="14" y="${AY-10}">fifteen centimetres of forearm at ${st.vel.toFixed(1)} cm a second</text>`;
    s+=`<text class="xs" x="14" y="${AY+80}">watch the dot, not the curve · ${(15/st.vel).toFixed(1)} seconds for one pass</text>`;
  }else{
    s+=`<text class="xs" x="${L}" y="${AY-10}">fifteen centimetres of forearm, stroked at ${st.vel.toFixed(1)} cm a second — watch the dot, not the curve</text>`;
    s+=`<text class="sm" x="${W-R+12}" y="${AY+38}">${(15/st.vel).toFixed(1)} seconds</text>`;
    s+=`<text class="xs" x="${W-R+12}" y="${AY+56}">for one pass</text>`;
  }
  return s+"</svg>";
}

/* ══ 5. speed × warmth ═════════════════════════════════════════ */
function sceneWarmth(st){
  /* Narrow: the plot keeps the width and the verdict moves underneath it. */
  const H  = NARROW ? 376 : 300;
  const L  = NARROW ? 70 : 100;
  const R  = NARROW ? 14 : 190;
  const T  = 26;
  const PH = NARROW ? 150 : 196;
  const lv=v=>Math.log(v)/Math.LN10;
  const x=v=>L+(lv(v)-lv(0.25))/(lv(40)-lv(0.25))*(W-L-R);
  const temps=[{t:18,n:"cool",y:T+22},{t:32,n:"skin warm",y:T+PH/2},{t:42,n:"hot",y:T+PH-22}];
  const sel=temps.find(z=>z.t===st.temp);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="The sweet spot needs the right speed and the right warmth">`;
  s+=`<ellipse cx="${(x(1)+x(10))/2}" cy="${T+PH/2}" rx="${(x(10)-x(1))/2+26}" ry="${NARROW?38:46}"
    fill="var(--clay)" opacity=".16"/>`;
  s+=`<ellipse cx="${(x(1)+x(10))/2}" cy="${T+PH/2}" rx="${(x(10)-x(1))/2}" ry="${NARROW?24:28}"
    fill="var(--clay)" opacity=".2"/>`;
  s+=`<text class="lab" x="${(x(1)+x(10))/2}" y="${T+PH/2-(NARROW?48:56)}" text-anchor="middle" style="fill:var(--dis)">the sweet spot</text>`;
  temps.forEach(z=>{
    const on=z.t===st.temp;
    s+=`<line x1="${L}" y1="${z.y}" x2="${W-R}" y2="${z.y}" stroke="var(--rule)"
      stroke-width="${on?0:1.5}" stroke-dasharray="${on?"none":"3 6"}"/>`;
    s+=`<text class="sm" x="${L-14}" y="${z.y+5}" text-anchor="end" style="fill:var(${on?"--ink":"--ink3"})">${z.t}°</text>`;
    s+=`<text class="xs" x="${L-14}" y="${z.y+21}" text-anchor="end">${esc(z.n)}</text>`;
  });
  SPEEDS.forEach(v=> s+=`<text class="xs" x="${x(v)}" y="${T+PH+24}" text-anchor="middle">${v}</text>`);
  s+=`<text class="xs" x="${(L+W-R)/2}" y="${T+PH+46}" text-anchor="middle">centimetres a second</text>`;
  s+=`<circle cx="${x(st.vel2)}" cy="${sel.y}" r="12" fill="var(--clay)"
    stroke="var(--card)" stroke-width="3"/>`;
  const inSpeed = st.vel2>=1 && st.vel2<=10, inTemp = st.temp===32;
  const verdict = inSpeed&&inTemp ? ["In the spot.","Right speed, right warmth."]
    : inTemp ? ["Warmth is right.","The speed is off the hill."]
    : inSpeed ? ["Speed is right.","Every speed rates lower away from skin temperature."]
    : ["Both are off.","This is the corner the research says is least pleasant."];
  if(NARROW){
    const VY=T+PH+86;
    s+=`<text class="lab" x="14" y="${VY}" style="fill:var(${inSpeed&&inTemp?"--clay":"--ink2"})">${esc(verdict[0])}</text>`;
    s+=`<foreignObject x="14" y="${VY+10}" width="${W-28}" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:15px;line-height:1.45;color:var(--ink2)">${esc(verdict[1])}</div>
      </foreignObject>`;
    s+=`<text class="xs" x="14" y="${VY+92}">People rated every speed more pleasant at</text>`;
    s+=`<text class="xs" x="14" y="${VY+108}">skin temperature than at 18° or 42°.</text>`;
  }else{
    /* verdict[1] wraps: the "Both are off." variant is 308u of text in a
       158u column and used to run off the right edge of the canvas. */
    s+=`<text class="lab" x="${W-R+16}" y="${T+82}" style="fill:var(${inSpeed&&inTemp?"--clay":"--ink2"})">${esc(verdict[0])}</text>`;
    s+=`<foreignObject x="${W-R+16}" y="${T+90}" width="${R-32}" height="72">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:15px;line-height:1.4;color:var(--ink2)">${esc(verdict[1])}</div>
      </foreignObject>`;
    s+=`<text class="xs" x="${W-R+16}" y="${T+196}">People rated every speed</text>`;
    s+=`<text class="xs" x="${W-R+16}" y="${T+212}">more pleasant at skin</text>`;
    s+=`<text class="xs" x="${W-R+16}" y="${T+228}">temperature than at 18°</text>`;
    s+=`<text class="xs" x="${W-R+16}" y="${T+244}">or 42°.</text>`;
  }
  return s+"</svg>";
}

/* ══ 12. the same stroke, four contexts ════════════════════════ */
const CTX=[
 {id:"consent", n:"they agreed to it", off:"they did not agree to it"},
 {id:"known",   n:"someone they trust", off:"a stranger"},
 {id:"warned",  n:"they knew it was coming", off:"it arrived unannounced"}
];
function sceneContext(st){
  const S = st || {ctx:{consent:true,known:true,warned:true}};
  const on = k => S.ctx ? S.ctx[k] : true;
  const score = (on("consent")?2:0)+(on("known")?1:0)+(on("warned")?1:0);
  const verdicts=[
   ["Intrusive","Physically identical. Experienced as a violation."],
   ["Intrusive","Physically identical. Experienced as a violation."],
   ["Endured","Tolerated rather than received. The nerves are firing the same way."],
   ["Neutral","It lands, but it is not doing much."],
   ["Welcome","The same stroke, and now it is worth something."]
  ];
  const v=verdicts[score];
  /* Narrow: the conditions become a bulleted list above the doorway, and the
     verdict moves underneath it — the arcs have nowhere to go at this width. */
  const H = NARROW ? 486 : 302;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="The same stroke read as ${esc(v[0].toLowerCase())}">`;
  if(NARROW){
    s+=`<text class="xs" x="12" y="22">the physical touch, unchanged in every case</text>`;
    s+=`<rect x="12" y="30" width="250" height="34" rx="17" fill="var(--soft)"/>`;
    s+=`<circle cx="86" cy="47" r="10" fill="var(--clay)" opacity=".85"/>`;
    s+=`<text class="sm" x="12" y="88">3 cm/s · 32° · on a forearm</text>`;
    CTX.forEach((c,i)=>{
      const yy=124+i*26, ok=on(c.id);
      s+=`<circle cx="18" cy="${yy-5}" r="5" fill="var(${ok?"--sage":"--neg"})" opacity=".8"/>`;
      s+=`<text class="sm" x="34" y="${yy}" style="fill:var(${ok?"--ink":"--ink3"})">${esc(ok?c.n:c.off)}</text>`;
    });
    const DX=122, DW=176, DTOP=210, DBASE=336;
    s+=`<path d="M${DX} ${DBASE}V${DTOP+38}a${DW/2} ${DW/2} 0 0 1 ${DW} 0V${DBASE}"
      fill="var(--paper2)" stroke="var(--clay)" stroke-width="3"/>`;
    s+=`<text class="sm" x="${DX+DW/2}" y="${DTOP+92}" text-anchor="middle" style="fill:var(--dis)">the fibres</text>`;
    s+=`<text class="xs" x="${DX+DW/2}" y="${DTOP+112}" text-anchor="middle">a doorway</text>`;
    s+=`<rect x="${DX-24}" y="${DBASE}" width="${DW+48}" height="12" rx="6" fill="var(--soft)"/>`;
    s+=`<text class="big" x="12" y="${DBASE+62}" style="font-size:31px"
      fill="var(${score>=4?"--sage":score<=1?"--neg":"--ink2"})">${esc(v[0])}</text>`;
    s+=`<foreignObject x="12" y="${DBASE+74}" width="${W-24}" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:15px;line-height:1.45;color:var(--ink2)">${esc(v[1])}</div>
      </foreignObject>`;
    return s+"</svg>";
  }
  /* the identical physical stroke, always the same, clear of everything else */
  s+=`<text class="xs" x="60" y="26">the physical touch, unchanged in every case</text>`;
  s+=`<rect x="60" y="34" width="330" height="34" rx="17" fill="var(--soft)"/>`;
  s+=`<circle cx="150" cy="51" r="10" fill="var(--clay)" opacity=".85"/>`;
  s+=`<text class="sm" x="402" y="56">3 cm/s · 32° · on a forearm</text>`;
  /* the doorway, moved right and down so nothing lands on it */
  const DX=442, DW=176, DTOP=118, DBASE=272;
  s+=`<path d="M${DX} ${DBASE}V${DTOP+38}a${DW/2} ${DW/2} 0 0 1 ${DW} 0V${DBASE}"
    fill="var(--paper2)" stroke="var(--clay)" stroke-width="3"/>`;
  s+=`<text class="sm" x="${DX+DW/2}" y="${DTOP+96}" text-anchor="middle" style="fill:var(--dis)">the fibres</text>`;
  s+=`<text class="xs" x="${DX+DW/2}" y="${DTOP+116}" text-anchor="middle">a doorway</text>`;
  s+=`<rect x="${DX-24}" y="${DBASE}" width="${DW+48}" height="12" rx="6" fill="var(--soft)"/>`;
  /* what is arriving with it */
  CTX.forEach((c,i)=>{
    const yy=142+i*40, ok=on(c.id);
    s+=`<text class="sm" x="392" y="${yy}" text-anchor="end" style="fill:var(${ok?"--ink":"--ink3"})">${esc(ok?c.n:c.off)}</text>`;
    s+=`<path d="M400 ${yy-5}q20 0 34 ${(DTOP+70-yy)/2}" fill="none"
      stroke="var(${ok?"--sage":"--neg"})" stroke-width="2" opacity=".55"/>`;
  });
  /* the verdict */
  s+=`<text class="big" x="656" y="152" style="font-size:31px"
    fill="var(${score>=4?"--sage":score<=1?"--neg":"--ink2"})">${esc(v[0])}</text>`;
  s+=`<foreignObject x="656" y="166" width="${W-686}" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml"
      style="font-family:Newsreader,serif;font-size:15px;line-height:1.5;color:var(--ink2)">${esc(v[1])}</div>
    </foreignObject>`;
  return s+"</svg>";
}
