/* ══ 7. skin cross-section ═════════════════════════════════════ */
const RECEPTORS=[
 {id:"merkel", n:"Merkel cells", d:.30, x:.22, c:"--blue", job:"edges, texture, fine detail",
  say:"Shallow and densely packed in fingertips. These are the ones reading the raised dots of braille, or the grain of a fabric. They keep firing as long as pressure is held."},
 {id:"meissner", n:"Meissner corpuscles", d:.22, x:.42, c:"--blue", job:"slip and flutter",
  say:"Also shallow, but they only answer to change. They are why you tighten your grip on a glass a fraction of a second before you consciously notice it sliding."},
 {id:"ruffini", n:"Ruffini endings", d:.72, x:.62, c:"--sage", job:"skin stretch",
  say:"Deep, and tuned to skin being pulled rather than pressed. Part of how you know where your hand is in the dark, and the receptor most engaged by a slow drag across tissue."},
 {id:"pacinian", n:"Pacinian corpuscles", d:.86, x:.80, c:"--sage", job:"fast vibration",
  say:"Deep, large, and extremely sensitive to rapid vibration. They are how you feel the texture of a surface through the end of a tool rather than through your own skin."},
 {id:"ct", n:"Free nerve endings", d:.16, x:.10, c:"--clay", job:"slow, affectionate contact",
  say:"No capsule, no structure, wandering in the upper layers of hairy skin. Poor at what and where. These are the C-tactile fibres, and the rest of this page is about them."}
];
function sceneSkin(st){
  const sel=RECEPTORS.find(r=>r.id===st.rec)||RECEPTORS[0];
  /* Narrow: the cross-section keeps the full width and the description moves
     underneath it instead of sitting in a right-hand column. */
  const H = NARROW ? 442 : 330;
  const L = NARROW ? 14 : 60;
  const R = NARROW ? 14 : 272;
  const T = NARROW ? 56 : 40;
  const SH = NARROW ? 172 : 190;
  const bw=W-L-R;
  const y=d=>T+22+d*(SH-40);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Where the touch receptors sit in the skin">`;
  /* layers */
  s+=`<rect x="${L}" y="${T}" width="${bw}" height="34" rx="10" fill="var(--soft)"/>`;
  s+=`<rect x="${L}" y="${T+34}" width="${bw}" height="${SH-34}" rx="10" fill="var(--paper2)"/>`;
  s+=`<text class="xs" x="${L+10}" y="${T+22}">epidermis · the surface</text>`;
  s+=`<text class="xs" x="${L+10}" y="${T+SH-12}">dermis · deeper tissue</text>`;
  /* a hair, because it matters which skin */
  s+=`<path d="M${L+52} ${T+6}q-8 -30 6 -34" stroke="var(--ink3)" stroke-width="2"
    fill="none" stroke-linecap="round"/>`;
  s+=`<text class="xs" x="${L+64}" y="${T-16}">hairy skin</text>`;
  RECEPTORS.forEach(r=>{
    const cx=L+r.x*bw, cy=y(r.d), on=r.id===sel.id;
    s+=`<g data-rec="${r.id}" style="cursor:pointer">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${T+SH+2}" stroke="var(${r.c})"
        stroke-width="${on?2.5:1.5}" opacity="${on?.6:.28}"/>`;
    if(r.id==="ct")
      s+=`<path d="M${cx-14} ${cy}q7 -12 14 0t14 0" stroke="var(${r.c})" stroke-width="${on?4:3}"
        fill="none" stroke-linecap="round"/>`;
    else if(r.id==="pacinian")
      s+=`<ellipse cx="${cx}" cy="${cy}" rx="${on?15:12}" ry="${on?11:9}" fill="none"
        stroke="var(${r.c})" stroke-width="${on?3:2}"/>
        <ellipse cx="${cx}" cy="${cy}" rx="${on?8:6}" ry="${on?6:5}" fill="var(${r.c})" opacity=".4"/>`;
    else if(r.id==="ruffini")
      s+=`<path d="M${cx-14} ${cy}h28M${cx-10} ${cy-7}h20M${cx-10} ${cy+7}h20"
        stroke="var(${r.c})" stroke-width="${on?3:2}" stroke-linecap="round"/>`;
    else
      s+=`<circle cx="${cx}" cy="${cy}" r="${on?10:8}" fill="var(${r.c})" opacity="${on?.85:.5}"/>`;
    s+=`</g>`;
  });
  /* Only the selected receptor is named under the diagram. Five job labels
     side by side collide at any width — "edges, texture, fine detail" and
     "slow, affectionate contact" are 150u wide in a 528u band. */
  s+=`<text class="sm" x="${L+bw/2}" y="${T+SH+26}" text-anchor="middle"
    style="fill:var(${sel.c})">${esc(sel.job)}</text>`;
  /* the panel */
  const RX = NARROW ? L : W-R+22;
  const PY = NARROW ? T+SH+58 : T+16;
  const PW = NARROW ? bw : R-52;
  s+=`<text class="lab" x="${RX}" y="${PY}" style="fill:var(${sel.c})">${esc(sel.n)}</text>`;
  s+=`<foreignObject x="${RX}" y="${PY+10}" width="${PW}" height="${NARROW?118:180}">
    <div xmlns="http://www.w3.org/1999/xhtml"
      style="font-family:Newsreader,serif;font-size:15px;line-height:1.5;color:var(--ink2)">${esc(sel.say)}</div>
    </foreignObject>`;
  s+=`<text class="xs" x="${L}" y="${H-8}">tap any receptor</text>`;
  return s+"</svg>";
}

/* ══ 8. two-point acuity, drawn to scale ═══════════════════════ */
const PARTS=[
 {id:"finger", n:"fingertip", mm:2.5}, {id:"lip", n:"lips", mm:5},
 {id:"palm", n:"palm", mm:10}, {id:"forehead", n:"forehead", mm:15},
 {id:"forearm", n:"forearm", mm:35}, {id:"back", n:"back", mm:39},
 {id:"calf", n:"calf", mm:45}
];
function sceneAcuity(st){
  const p=PARTS.find(z=>z.id===st.part)||PARTS[0];
  /* Narrow: the header wraps to two lines, the comparison rows get room to
     breathe, and the mm scale drops just enough that a 45mm calf still fits. */
  const H  = NARROW ? 392 : 324;
  const L  = NARROW ? 10 : 64;
  const R  = NARROW ? 10 : 64;
  const T  = NARROW ? 76 : 52;
  const px = mm => mm * (NARROW ? 7.0 : 7.4);
  const cx=(L+W-R)/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Two points ${p.mm} millimetres apart, as felt on the ${p.n}">`;
  const part=`<tspan style="font-family:Fraunces,serif" fill="var(--clay)">${esc(p.n)}</tspan>`;
  if(NARROW){
    s+=`<text class="sm" x="${L}" y="${T-46}">the closest two points that can</text>`;
    s+=`<text class="sm" x="${L}" y="${T-24}">still feel like two, on the ${part}</text>`;
  } else {
    s+=`<text class="sm" x="${L}" y="${T-16}">the closest two points can be on the ${part} and still feel like two</text>`;
  }
  /* the gap, to scale */
  const gap=px(p.mm), y0=NARROW?T+40:T+58;
  s+=`<line x1="${cx-gap/2}" y1="${y0}" x2="${cx+gap/2}" y2="${y0}" stroke="var(--rule)" stroke-width="2"/>`;
  s+=`<circle cx="${cx-gap/2}" cy="${y0}" r="9" fill="var(--clay)"/>`;
  s+=`<circle cx="${cx+gap/2}" cy="${y0}" r="9" fill="var(--clay)"/>`;
  s+=`<text class="big" x="${cx}" y="${y0+58}" text-anchor="middle">${p.mm} mm</text>`;
  /* every part, as a faint comparison row */
  const RY=y0+96, GAP=NARROW?22:13, BX=NARROW?78:L+96;
  s+=`<text class="xs" x="${L}" y="${RY-14}">all of them, same scale</text>`;
  PARTS.forEach((q,i)=>{
    const yy=RY+i*GAP, on=q.id===p.id, g=px(q.mm);
    s+=`<line x1="${BX}" y1="${yy}" x2="${BX+g}" y2="${yy}"
      stroke="var(${on?"--clay":"--rule"})" stroke-width="${on?4:3}" stroke-linecap="round"/>`;
    s+=`<text class="xs" x="${BX-8}" y="${yy+4}" text-anchor="end" style="fill:var(${on?"--ink":"--ink3"})">${esc(q.n)}</text>`;
  });
  const note="a fingertip is about twenty times finer than a back";
  if(NARROW) s+=`<text class="xs" x="${L}" y="${H-10}">${note}</text>`;
  else s+=`<text class="xs" x="${W-R}" y="${RY+PARTS.length*GAP-4}" text-anchor="end">${note}</text>`;
  return s+"</svg>";
}

/* ══ 9. the gate ═══════════════════════════════════════════════ */
function sceneGate(st){
  /* Narrow: the modulating inputs move to the top as their own two lines,
     and the whole flow shifts left so "less pain" still fits on the right. */
  const H  = NARROW ? 286 : 270;
  const cx = NARROW ? 230 : 430;
  const cy = NARROW ? 170 : 150;
  const IX = NARROW ? 10 : 120;
  const open = st.gateTouch ? 0.34 : 1;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Touch partly closes the gate that pain signals pass through">`;
  /* from above */
  if(NARROW){
    s+=`<text class="xs" x="10" y="20">attention, expectation, mood, safety</text>`;
    s+=`<text class="xs" x="10" y="36">— can open or close it too</text>`;
    s+=`<path d="M${cx} 46V${cy-62}" stroke="var(--sage)" stroke-width="3"
      fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>`;
  }else{
    s+=`<path d="M${cx} 26V${cy-62}" stroke="var(--sage)" stroke-width="3"
      fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>`;
    s+=`<text class="sm" x="${cx+12}" y="26">attention, expectation, mood, safety</text>`;
    s+=`<text class="xs" x="${cx+12}" y="44">— can open or close it too</text>`;
  }
  const TY = NARROW ? 84 : 34;
  s+=`<text class="sm" x="${IX}" y="${TY}">a knock, a burn, a strain</text>`;
  s+=`<path d="M${IX} ${TY+26}C${IX+120} ${TY+26} ${cx-180} ${cy-8} ${cx-58} ${cy-6}" stroke="var(--clay)"
    stroke-width="4" fill="none" stroke-linecap="round"/>`;
  s+=`<text class="sm" x="${IX}" y="${cy+66}">touch on the same patch of skin</text>`;
  s+=`<path d="M${IX} ${cy+40}C${cx-180} ${cy+40} ${cx-180} ${cy+14} ${cx-58} ${cy+12}"
    stroke="var(--blue)" stroke-width="4" fill="none" stroke-linecap="round"
    opacity="${st.gateTouch?1:.22}"/>`;
  /* the gate */
  s+=`<rect x="${cx-52}" y="${cy-58}" width="104" height="118" rx="20"
    fill="var(--paper2)" stroke="var(--rule)" stroke-width="2"/>`;
  s+=`<text class="xs" x="${cx}" y="${cy+80}" text-anchor="middle">the gate</text>`;
  const w=8+open*56;
  s+=`<rect x="${cx-w/2}" y="${cy-30}" width="${w}" height="62" rx="7"
    fill="var(--clay)" opacity=".28"/>`;
  s+=`<line x1="${cx-34}" y1="${cy-34}" x2="${cx-34}" y2="${cy+36}" stroke="var(--ink3)" stroke-width="3" stroke-linecap="round"/>`;
  s+=`<line x1="${cx+34}" y1="${cy-34}" x2="${cx+34}" y2="${cy+36}" stroke="var(--ink3)" stroke-width="3" stroke-linecap="round"/>`;
  /* out the other side */
  const out = st.gateTouch ? .38 : 1;
  const OX = NARROW ? W-80 : W-190;
  s+=`<path d="M${cx+58} ${cy}H${OX}" stroke="var(--clay)"
    stroke-width="${1.5+out*4}" fill="none" stroke-linecap="round" opacity="${.35+out*.6}"/>`;
  s+=`<text class="lab" x="${OX+8}" y="${cy+5}">${st.gateTouch?"less pain":"pain"}</text>`;
  return s+"</svg>";
}

/* ══ 10. who may touch you where ═══════════════════════════════ */
const ZONES=[
 {id:"head", n:"head", x:.50, y:.09, r:.075},
 {id:"chest", n:"chest", x:.50, y:.28, r:.10},
 {id:"arm",  n:"upper arms", x:.245, y:.26, r:.072},
 {id:"arm2", n:"", x:.755, y:.26, r:.072},
 {id:"hand", n:"hands", x:.16, y:.44, r:.055},
 {id:"hand2",n:"", x:.84, y:.44, r:.055},
 {id:"torso",n:"torso", x:.50, y:.45, r:.095},
 {id:"hips", n:"hips", x:.50, y:.60, r:.085},
 {id:"legs", n:"legs", x:.395, y:.79, r:.075},
 {id:"legs2",n:"", x:.605, y:.79, r:.075},
 {id:"feet", n:"feet", x:.50, y:.95, r:.048}
];
const BONDS=[
 {id:"partner", n:"partner", area:1.0, allow:{head:1,chest:1,arm:1,hand:1,torso:1,hips:1,legs:1,feet:.9}},
 {id:"parent",  n:"parent",  area:.62, allow:{head:.9,chest:.5,arm:1,hand:1,torso:.5,hips:.15,legs:.5,feet:.4}},
 {id:"sibling", n:"sibling", area:.55, allow:{head:.7,chest:.4,arm:1,hand:1,torso:.4,hips:.1,legs:.4,feet:.35}},
 {id:"friend",  n:"close friend", area:.45, allow:{head:.5,chest:.3,arm:.95,hand:1,torso:.25,hips:.05,legs:.25,feet:.2}},
 {id:"acq",     n:"acquaintance", area:.22, allow:{head:.12,chest:.06,arm:.6,hand:.95,torso:.05,hips:0,legs:.05,feet:.05}},
 {id:"stranger",n:"stranger", area:.10, allow:{head:.03,chest:0,arm:.25,hand:.85,torso:0,hips:0,legs:0,feet:0}}
];
function sceneTopo(st){
  /* Narrow: the body sits above the bars instead of beside them. */
  const H  = NARROW ? 640 : 356;
  const BX = NARROW ? 135 : 150;
  const BY = NARROW ? 16 : 22;
  const BW = 150;
  const BH = NARROW ? 250 : 290;
  const b=BONDS.find(z=>z.id===st.bond)||BONDS[0];
  const key=id=>id.replace(/2$/,"");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Where a ${esc(b.n)} may touch you, and how the total area compares">`;
  s+=`<path d="M${BX+75} ${BY+6}a20 20 0 1 1 -.1 0
    M${BX+75} ${BY+30}c-30 0 -46 12 -46 34v58c0 8 -12 44 -14 62h14c4 -16 12 -40 12 -40
    v46c0 24 -6 60 -8 88h20c2 -28 8 -56 8 -80h28c0 24 6 52 8 80h20c-2 -28 -8 -64 -8 -88
    v-46s8 24 12 40h14c-2 -18 -14 -54 -14 -62v-58c0 -22 -16 -34 -46 -34Z"
    fill="var(--paper2)" stroke="var(--rule)" stroke-width="1.5"
    transform="translate(${BX} ${BY}) scale(1 ${(BH/290).toFixed(3)}) translate(${-BX} ${-BY})"/>`;
  ZONES.forEach(z=>{
    const a=b.allow[key(z.id)]||0;
    if(a<=0.02) return;
    s+=`<ellipse cx="${BX+z.x*BW}" cy="${BY+z.y*BH}" rx="${z.r*BW*1.5}" ry="${z.r*BH*0.62}"
      fill="var(--clay)" opacity="${(0.12+a*0.42).toFixed(2)}"/>`;
  });
  s+=`<text class="lab" x="${BX+BW/2}" y="${BY+BH+26}" text-anchor="middle">${esc(b.n)}</text>`;
  /* the reliable finding: total area against bond */
  const CX = NARROW ? 12 : 420;
  const TY = NARROW ? BY+BH+64 : BY+26;
  const CW = NARROW ? W-CX-12 : W-CX-70;
  const LW = NARROW ? 98 : 104;
  const ROW = NARROW ? 30 : 36;
  if(NARROW){
    s+=`<text class="sm" x="${CX}" y="${TY}">the finding that held across five countries</text>`;
    s+=`<text class="xs" x="${CX}" y="${TY+20}">total area you would allow, by how close the bond is</text>`;
  }else{
    s+=`<text class="sm" x="${CX}" y="${TY}">the finding that held across five countries</text>`;
    s+=`<text class="xs" x="${CX}" y="${TY+20}">total area you would allow, by how close the bond is</text>`;
  }
  BONDS.forEach((z,i)=>{
    const yy=TY+44+i*ROW, on=z.id===b.id;
    s+=`<text class="sm" x="${CX+LW}" y="${yy+5}" text-anchor="end" style="fill:var(${on?"--ink":"--ink3"})">${esc(z.n)}</text>`;
    s+=`<rect x="${CX+LW+10}" y="${yy-11}" width="${(CW-LW-20)*z.area}" height="20" rx="10"
      fill="var(--clay)" opacity="${on?.72:.24}" data-bond="${z.id}" style="cursor:pointer"/>`;
  });
  const note="Zones here are a simplification. The published maps are finer, and the solid result is the relationship between bond and area.";
  if(NARROW){
    s+=`<foreignObject x="${CX}" y="${TY+44+BONDS.length*ROW+2}" width="${W-CX-12}" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:13px;line-height:1.4;color:var(--ink3)">${esc(note)}</div>
      </foreignObject>`;
  }else{
    /* was a single 694u line at x=420 on an 860 canvas — it ran off the edge */
    s+=`<foreignObject x="${CX}" y="${TY+44+BONDS.length*ROW-16}" width="${W-CX-40}" height="56">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:13px;line-height:1.4;color:var(--ink3)">${esc(note)}</div>
      </foreignObject>`;
  }
  return s+"</svg>";
}

/* ══ 11. how sure are we ═══════════════════════════════════════ */
function sceneClaims(st){
  const shown = !st || st.claimsShown;
  /* Narrow: each claim reads as a line of text with its bar underneath,
     rather than a right-hand label column against a shared axis. */
  const ROW = NARROW ? 96 : 60;
  const H  = NARROW ? 44+CLAIMS.length*ROW+30 : 54+CLAIMS.length*ROW;
  const L  = NARROW ? 12 : 56;
  const R  = NARROW ? 12 : 64;
  const BX = NARROW ? 12 : L+392;
  const x=v=>BX+v*(W-BX-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="How well supported each claim about touch is">`;
  s+=`<text class="xs" x="${BX}" y="24">less sure</text>`;
  s+=`<text class="xs" x="${W-R}" y="24" text-anchor="end">more sure</text>`;
  s+=`<line x1="${BX}" y1="34" x2="${W-R}" y2="34" stroke="var(--rule)" stroke-width="1.5"/>`;
  CLAIMS.forEach((c,i)=>{
    const top = NARROW ? 44+i*ROW : 0;
    const yy  = NARROW ? top+68 : 62+i*ROW;
    const col = c.s>.7 ? "--sage" : c.s>.5 ? "--gold" : "--clay";
    s+=`<line x1="${BX}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--soft)" stroke-width="7"
      stroke-linecap="round"/>`;
    if(shown) s+=`<line x1="${BX}" y1="${yy}" x2="${x(c.s)}" y2="${yy}" stroke="var(${col})"
      stroke-width="7" stroke-linecap="round" opacity=".55"/>`;
    if(shown) s+=`<circle cx="${x(c.s)}" cy="${yy}" r="8" fill="var(${col})"/>`;
    if(!shown && i===CLAIMS.length-1){
      s+=`<circle cx="${x(st.claimGuess)}" cy="${yy}" r="8" fill="none"
        stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="4 3"/>`;
      s+=`<text class="xs" x="${x(st.claimGuess)}" y="${yy-16}" text-anchor="middle">your guess</text>`;
    }
    if(shown && i===CLAIMS.length-1 && st && st.claimGuess!=null && Math.abs(st.claimGuess-c.s)>.02){
      s+=`<circle cx="${x(st.claimGuess)}" cy="${yy}" r="8" fill="none"
        stroke="var(--ink3)" stroke-width="2" stroke-dasharray="4 3"/>`;
      s+=`<text class="xs" x="${x(st.claimGuess)}" y="${yy+24}" text-anchor="middle">you said</text>`;
    }
    s+=`<foreignObject x="${L}" y="${NARROW?top:yy-26}" width="${NARROW?W-24:BX-L-26}" height="${NARROW?52:56}">
      <div xmlns="http://www.w3.org/1999/xhtml"
        style="font-family:Newsreader,serif;font-size:15px;line-height:1.35;color:var(--ink);text-align:${NARROW?"left":"right"}">
        ${esc(c.t)}<div style="font-size:13px;color:var(--ink3);line-height:1.3">${esc(c.n)}</div></div>
      </foreignObject>`;
  });
  return s+"</svg>";
}

Object.assign(SCENES, {skin:sceneSkin, acuity:sceneAcuity, gate:sceneGate,
  topography:sceneTopo, claims:sceneClaims});
/* page.js — assembles the journey and wires the two interactive figures.
   Scroll-based, because this is reading rather than a lesson. */

const $ = s => document.querySelector(s);
const ST = {vel:3, vel2:3, temp:32, rec:"ct", part:"finger", gateTouch:true, bond:"stranger",
  stim:"brush", claimsShown:false, claimGuess:.7, ctx:{consent:true,known:true,warned:true}};

/* Expand the two markup conventions used in journey.js:
     [ref:id]           -> superscript link to the reference list
     {{Wiki Page|text}} -> link to English Wikipedia                       */
const REF_ORDER = [];
function refNum(id){
  if(!REFS[id]) return null;
  let i = REF_ORDER.indexOf(id);
  if(i < 0){ REF_ORDER.push(id); i = REF_ORDER.length-1; }
  return i+1;
}
function md(s){
  if(!s) return "";
  return String(s)
    .replace(/\{\{([^|}]+)\|([^}]+)\}\}/g, (m,page,text) =>
      `<a class="wiki" href="https://en.wikipedia.org/wiki/${encodeURIComponent(page.trim().replace(/ /g,"_"))}"
        target="_blank" rel="noopener" title="Wikipedia: ${esc(page.trim())}">${text}</a>`)
    .replace(/\[ref:([a-z0-9]+)\]/g, (m,id) => {
      const n = refNum(id);
      return n ? `<a class="cite" href="#ref-${id}" title="${esc(REFS[id].a+" "+REFS[id].y)}">${n}</a>` : "";
    });
}

const paperCard = p => !p ? "" : `
  <div class="paper">
    <div class="who">${esc(p.who)} · ${p.y}</div>
    <div class="what">${esc(p.what)}</div>
    <div class="where">${esc(p.where)}</div>
    <div style="margin-top:7px"><a href="${p.u}" target="_blank" rel="noopener">open the paper →</a></div>
    <div class="grade">${esc(p.grade)}</div>
  </div>`;

const figure = (inner, cap) =>
  `<figure class="wide">${inner}${cap?`<div class="cap">${cap}</div>`:""}</figure>`;

function sceneFor(st){
  switch(st.scene){
    case "speed": return `
      <figure class="wide">
        <div class="controls">
          <label>how fast you stroke
            <input type="range" id="vel" min="0.3" max="30" step="0.1" value="${ST.vel}"
              aria-label="Stroking speed"></label>
          <b id="velv">${ST.vel.toFixed(1)} cm/s</b>
        </div>
        <div id="speedFig">${SCENES.speed(ST)}</div>
        <div class="cap">Curve shapes follow the published figure; the firing values are
          rough rather than exact. The dot moves at the real speed.</div>
      </figure>`;
    case "warmth": return `
      <figure class="wide">
        <div class="controls">
          <label>speed
            <input type="range" id="vel2" min="0.3" max="30" step="0.1" value="${ST.vel2}"
              aria-label="Stroking speed"></label>
          <b id="vel2v">${ST.vel2.toFixed(1)} cm/s</b>
          <span style="display:flex;gap:8px">
            ${[18,32,42].map(t=>`<button class="pill" data-temp="${t}"
              aria-pressed="${ST.temp===t}">${t}°</button>`).join("")}
          </span>
        </div>
        <div id="warmFig">${SCENES.warmth(ST)}</div>
        <div class="cap">A simplified picture of two findings held together. The sweet spot
          is drawn as a region because that is how it behaves, not as a measured contour.</div>
      </figure>`;
    case "roads": return `
      <figure class="wide">
        <div class="controls">
          <button class="pill" id="sendBtn">send a touch →</button>
          <span id="sendOut" style="color:var(--ink3)">both signals leave the skin at the same instant</span>
        </div>
        <div id="roadsFig">${SCENES.roads(ST)}</div>
        <div class="cap">The animation runs in real time. A fast signal crosses in a few
          hundredths of a second; the slow one takes about a second. That gap is the finding
          itself, not an effect added to illustrate it.</div>
      </figure>`;
    case "micro": return `
      <figure class="wide">
        <div class="controls"><span>touch the skin with</span>
          <button class="pill" data-stim="brush" aria-pressed="${ST.stim==="brush"}">a soft brush</button>
          <button class="pill" data-stim="sharp" aria-pressed="${ST.stim==="sharp"}">a sharp point</button></div>
        <div id="microFig">${SCENES.micro(ST)}</div>
        <div class="cap">The spike patterns are drawn to show the idea, not measured. The contrast is the real one: these
          fibres were told apart from pain fibres precisely by answering a gentle stimulus
          and not a sharp one.</div>
      </figure>`;
    case "claims": return `
      <figure class="wide">
        <div id="claimsCtl">${ST.claimsShown ? `<div class="controls">
            <button class="pill" id="claimsHide">hide the answers again</button></div>`
          : `<div class="controls">
            <span>before you look — how well supported is <b style="font-family:Fraunces,serif">“touch measurably raises oxytocin”</b>?</span>
            <input type="range" id="claimGuess" min="0" max="1" step=".01" value="${ST.claimGuess}"
              aria-label="Your estimate">
            <button class="pill" id="claimsShow">show the answers</button></div>`}</div>
        <div id="claimsFig">${SCENES.claims(ST)}</div>
        <div class="cap">Positions are a judgement about how much weight to give each claim,
          not measured effect sizes. Arranged so the shape of the field is visible.</div>
      </figure>`;
    case "context": return `
      <figure class="wide">
        <div class="controls"><span>everything physical stays the same — change only:</span>
          ${CTX.map(c=>`<button class="pill" data-ctx="${c.id}"
            aria-pressed="${ST.ctx[c.id]}">${esc(c.n)}</button>`).join("")}</div>
        <div id="ctxFig">${SCENES.context(ST)}</div>
        <div class="cap">Illustrative, not measured — no study assigns these labels. It is
          here because the point is hard to feel from a sentence and easy to feel from a
          switch.</div>
      </figure>`;
    case "skin": return `
      <figure class="wide"><div id="skinFig">${SCENES.skin(ST)}</div>
        <div class="cap">Depths and shapes are schematic. Tap a receptor to read what it does.</div></figure>`;
    case "acuity": return `
      <figure class="wide">
        <div class="controls"><span>where on the body</span>
          ${PARTS.map(q=>`<button class="pill" data-part="${q.id}"
            aria-pressed="${ST.part===q.id}">${esc(q.n)}</button>`).join("")}</div>
        <div id="acuFig">${SCENES.acuity(ST)}</div>
        <div class="cap">Drawn larger than life so the smallest gaps stay visible; the
          proportions between body parts are the real ones. Values are the classic Weinstein
          figures, widely reproduced — the ranking is solid, the exact millimetres less so.</div>
      </figure>`;
    case "gate": return `
      <figure class="wide">
        <div class="controls">
          <button class="pill" id="gateBtn" aria-pressed="${ST.gateTouch}">${ST.gateTouch?"hand on the skin":"no touch"}</button>
          <span id="gateHint" style="color:var(--ink3)">${ST.gateTouch?"tap to take the hand away":"tap to put the hand back"}</span></div>
        <div id="gateFig">${SCENES.gate(ST)}</div>
        <div class="cap">The original 1965 drawing, much simplified. Sixty years of revision
          have complicated the mechanism without overturning the central claim.</div>
      </figure>`;
    case "topography": return `
      <figure class="wide">
        <div class="controls"><span>who is touching you</span>
          ${BONDS.map(z=>`<button class="pill" data-bond2="${z.id}"
            aria-pressed="${ST.bond===z.id}">${esc(z.n)}</button>`).join("")}</div>
        <div id="topoFig">${SCENES.topography(ST)}</div>
        <div class="cap">The zones are a simplification of the published maps; the
          area-against-bond relationship on the right is the paper's actual finding.</div>
      </figure>`;
    case "revisions": return `
      <figure class="wide">
        <div class="cards" id="cards">${REVISIONS.map((r,i)=>`
          <button class="flip" data-i="${i}" aria-pressed="false">
            <div class="side"><span>what we said</span>${esc(r.old)}</div>
            <div class="tap">tap for the correction</div>
          </button>`).join("")}</div>
        <div class="cap">Four corrections from the last decade. Tap each card to turn it over.</div>
      </figure>`;
    default:
      return figure(SCENES[st.scene](ST));
  }
}

function assemble(){
layout();
REF_ORDER.length = 0;
$(".wrap").innerHTML = `
<header class="hero">
  <div class="eyebrow">${esc(HERO.eyebrow)}</div>
  <h1>${HERO.title}</h1>
  <div class="stand">${HERO.stand}</div>
</header>

<section class="about" aria-label="About this page">
  ${ABOUT.map(a=>`<div class="ab"><div class="k">${esc(a.k)}</div><div class="v">${md(a.v)}</div></div>`).join("")}
</section>

<nav class="toc" aria-label="Contents">${STOPS.map(s=>
  `<a href="#${s.id}" data-t="${s.id}">${esc(s.nav)}</a>`).join("")}
  <a href="#refs" data-t="refs" style="margin-top:8px">References</a></nav>

${STOPS.map(s=>`
${s.part?`<div class="part">${esc(s.part)}</div>`:""}
<section class="stop" id="${s.id}">
  <div class="year">${esc(s.year)}</div>
  <h2>${esc(s.title)}</h2>
  <div class="lead">${md(s.lead)}</div>
  ${s.src?`<div class="src"><span class="lbl">The research</span>${md(s.src.line)}</div>`:""}
  ${sceneFor(s)}
  <div class="body">${md(s.body)}</div>
  ${s.hands?`<div class="hands"><div class="t">For your hands</div><p>${md(s.hands)}</p></div>`:""}
</section>`).join("")}

<section class="close">
  <h2>What we would carry back into the room</h2>
  <p class="lead" style="max-width:34rem">Ten things we came away with, loosely ordered by
    how much weight we would put on each.</p>
  <ul class="rules">${RULES.map(r=>`<li><b>${esc(r.t)}</b><br>${esc(r.d)}</li>`).join("")}</ul>

  <div class="reading">
    <h3>If you want to go further</h3>
    ${FURTHER.map(f=>{const r=REFS[f.id];
      return `<div><a class="n" href="${r.u}" target="_blank" rel="noopener">${esc(r.a.split(",")[0])} et al. (${r.y})</a>
        — ${esc(r.d||f.d)}</div>`;}).join("")}
  </div>

  <div class="reading" id="refs">
    <h3>References</h3>
    <p style="font-size:15px;color:var(--ink3);margin-bottom:6px">In the order they are cited above.
      Every one is linked; several are free to read in full.</p>
    <ol class="refs">${REF_ORDER.map(id=>{const r=REFS[id];
      return `<li id="ref-${id}"><span class="au">${esc(r.a)}${r.y?" ("+r.y+")":""}</span>
        <a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a>
        <span class="jo">${esc(r.j)}</span></li>`;}).join("")}</ol>
  </div>

  <p class="foot">Assembled in 2026 from the literature as it stood. A reading of published
    research, written for people who work with touch. It is not medical advice, it does not
    describe a technique, and it cannot tell you what the person in front of you wants. Where
    researchers disagree we have tried to say so rather than tidy it away — that is not
    hedging, it is the current state of a young field still arguing productively with
    itself.</p>
</section>`;
}

/* ── the two interactive figures ───────────────────────────────── */
function wire(){
  const v=$("#vel");
  if(v) v.oninput=()=>{ ST.vel=+v.value; $("#velv").textContent=ST.vel.toFixed(1)+" cm/s";
    $("#speedFig").innerHTML=SCENES.speed(ST); stroke(); };
  const v2=$("#vel2");
  if(v2) v2.oninput=()=>{ ST.vel2=+v2.value; $("#vel2v").textContent=ST.vel2.toFixed(1)+" cm/s";
    $("#warmFig").innerHTML=SCENES.warmth(ST); };
  document.querySelectorAll("[data-temp]").forEach(b=>b.onclick=()=>{
    ST.temp=+b.dataset.temp;
    document.querySelectorAll("[data-temp]").forEach(z=>
      z.setAttribute("aria-pressed", +z.dataset.temp===ST.temp));
    $("#warmFig").innerHTML=SCENES.warmth(ST); });
  const sb=$("#sendBtn");
  if(sb) sb.onclick=()=>sendTouch();
  document.querySelectorAll("[data-stim]").forEach(b=>b.onclick=()=>{
    ST.stim=b.dataset.stim;
    document.querySelectorAll("[data-stim]").forEach(z=>
      z.setAttribute("aria-pressed", z.dataset.stim===ST.stim));
    $("#microFig").innerHTML=SCENES.micro(ST); });
  const cg=$("#claimGuess");
  if(cg) cg.oninput=()=>{ ST.claimGuess=+cg.value; $("#claimsFig").innerHTML=SCENES.claims(ST); };
  const swapClaims=v=>{
    ST.claimsShown=v;
    $("#claimsCtl").innerHTML = v
      ? `<div class="controls"><button class="pill" id="claimsHide">hide the answers again</button></div>`
      : `<div class="controls">
          <span>before you look — how well supported is <b style="font-family:Fraunces,serif">“touch measurably raises oxytocin”</b>?</span>
          <input type="range" id="claimGuess" min="0" max="1" step=".01" value="${ST.claimGuess}"
            aria-label="Your estimate">
          <button class="pill" id="claimsShow">show the answers</button></div>`;
    $("#claimsFig").innerHTML=SCENES.claims(ST);
    wire();
  };
  const cs=$("#claimsShow"); if(cs) cs.onclick=()=>swapClaims(true);
  const ch=$("#claimsHide"); if(ch) ch.onclick=()=>swapClaims(false);
  document.querySelectorAll("[data-ctx]").forEach(b=>b.onclick=()=>{
    ST.ctx[b.dataset.ctx]=!ST.ctx[b.dataset.ctx];
    b.setAttribute("aria-pressed", ST.ctx[b.dataset.ctx]);
    const c=CTX.find(z=>z.id===b.dataset.ctx);
    b.textContent = ST.ctx[b.dataset.ctx] ? c.n : c.off;
    $("#ctxFig").innerHTML=SCENES.context(ST); });
  document.querySelectorAll("[data-rec]").forEach(g=>g.onclick=()=>{
    ST.rec=g.dataset.rec; $("#skinFig").innerHTML=SCENES.skin(ST); wire(); });
  document.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{
    ST.part=b.dataset.part;
    document.querySelectorAll("[data-part]").forEach(z=>
      z.setAttribute("aria-pressed", z.dataset.part===ST.part));
    $("#acuFig").innerHTML=SCENES.acuity(ST); });
  const gb=$("#gateBtn");
  if(gb) gb.onclick=()=>{ ST.gateTouch=!ST.gateTouch;
    gb.setAttribute("aria-pressed",ST.gateTouch);
    gb.textContent = ST.gateTouch ? "hand on the skin" : "no touch";
    const gh=$("#gateHint");
    if(gh) gh.textContent = ST.gateTouch ? "tap to take the hand away" : "tap to put the hand back";
    $("#gateFig").innerHTML=SCENES.gate(ST); };
  const setBond=id=>{ ST.bond=id;
    document.querySelectorAll("[data-bond2]").forEach(z=>
      z.setAttribute("aria-pressed", z.dataset.bond2===ST.bond));
    $("#topoFig").innerHTML=SCENES.topography(ST); wire(); };
  document.querySelectorAll("[data-bond2]").forEach(b=>b.onclick=()=>setBond(b.dataset.bond2));
  document.querySelectorAll("[data-bond]").forEach(r=>r.onclick=()=>setBond(r.dataset.bond));
  document.querySelectorAll(".flip").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, r=REVISIONS[i], on=b.getAttribute("aria-pressed")==="true";
    b.setAttribute("aria-pressed", !on);
    b.innerHTML = on
      ? `<div class="side"><span>what we said</span>${esc(r.old)}</div>
         <div class="tap">tap for the correction</div>`
      : `<div class="side"><span>what we say now</span>${esc(r.neu)}</div>
         <div class="tap">${esc(r.src)}</div>`;
  });
}

/* Send one touch up both roads, in real time. A fast fibre crosses a forearm
   in a few hundredths of a second; the slow one takes about a second. Nothing
   here is sped up or slowed down — the gap is the point. */
let sendRaf=null;
function sendTouch(){
  const fp=document.getElementById("fastPath"), sp=document.getElementById("slowPath");
  const fd=document.getElementById("fastDot"), sd=document.getElementById("slowDot");
  const fl=document.getElementById("fastLand"), sl=document.getElementById("slowLand");
  const out=$("#sendOut");
  if(!fp||!sp||!fd||!sd) return;
  if(sendRaf) cancelAnimationFrame(sendRaf);
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){
    [fd,sd,fl,sl].forEach(el=>el&&el.setAttribute("opacity","1"));
    if(out) out.textContent="the slow signal lands about a second after the fast one";
    return;
  }
  const FL=fp.getTotalLength(), SL=sp.getTotalLength();
  const FAST=0.06, SLOW=1.0;                       // seconds, as in a real forearm
  [fl,sl].forEach(el=>el&&el.setAttribute("opacity","0"));
  const t0=performance.now();
  const step=now=>{
    const t=(now-t0)/1000;
    const f=Math.min(t/FAST,1), s=Math.min(t/SLOW,1);
    const pf=fp.getPointAtLength(FL*f), ps=sp.getPointAtLength(SL*s);
    fd.setAttribute("opacity", f<1?"1":"0.3"); fd.setAttribute("cx",pf.x); fd.setAttribute("cy",pf.y);
    sd.setAttribute("opacity", s<1?"1":"0.3"); sd.setAttribute("cx",ps.x); sd.setAttribute("cy",ps.y);
    if(f>=1&&fl) fl.setAttribute("opacity","1");
    if(s>=1&&sl) sl.setAttribute("opacity","1");
    if(out) out.textContent = s<1
      ? `fast signal arrived · the slow one is still travelling — ${(SLOW-t).toFixed(1)}s to go`
      : "the slow signal landed about a second after the fast one";
    if(f<1||s<1) sendRaf=requestAnimationFrame(step); else sendRaf=null;
  };
  sendRaf=requestAnimationFrame(step);
}

/* the dot travels at the true speed — 15 cm of forearm */
let raf=null;
function stroke(){
  if(raf) cancelAnimationFrame(raf);
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const step=ts=>{
    const el=document.getElementById("stroker");
    if(!el){ raf=null; return; }
    /* geometry comes from the scene, because it differs by layout */
    const secs=15/ST.vel, g=STROKE_GEOM;
    const u=((ts/1000)/secs)%2, f=u<1?u:2-u;
    el.setAttribute("cx", g.x+f*g.span);
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

/* contents highlighting */
let io = null;
function observeStops(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll(".toc a")];
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting)
      links.forEach(a=>a.classList.toggle("on", a.dataset.t===e.target.id)); });
  },{rootMargin:"-45% 0px -50% 0px"});
  STOPS.forEach(s=>{ const el=document.getElementById(s.id); if(el) io.observe(el); });
}

/* One full redraw. Called once at load, and again whenever the viewport
   crosses the narrow/wide boundary, because the scenes are drawn at a
   different width on each side of it. ST is module-level, so every control
   the reader has already touched keeps its value across the redraw. */
function render(){
  assemble();
  observeStops();
  wire();
  stroke();
}
render();
if(narrowQ){
  const onFlip = () => { const before = NARROW; if(layout() !== before) render(); };
  narrowQ.addEventListener ? narrowQ.addEventListener("change", onFlip)
                           : narrowQ.addListener(onFlip);
}

</script>
</body>
</html>
