## Applies to every document in this directory and below, and to nothing
## outside it.
##
## The warm theme, the stylesheet and the citation style are project-level
## (see _quarto.yml) — every story shares one copy. What stays here is what is
## genuinely this story's own: which references it cites, and which scripts
## draw its figures.

bibliography: refs.bib
link-citations: true

format:
  html:
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    include-after-body: _figures.html
